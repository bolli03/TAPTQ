7scenes-sparse:
  cfg:
    _target_: datasets.sevenscenes.SevenScenes
    split: test
    SEVENSCENES_DIR: ${oc.env:TMM_DATA_ROOT,${work_dir}/../data}/7scenes
    load_img_size: ${load_img_size}
    cache_file: ${oc.env:TMM_CACHE_ROOT,${work_dir}/../data/dataset_cache}/7scenes_mv_recon_cache.npy
  sampling:
    strategy: stride
    kf_every: 200  # ori setting in cut3r
  seq_id_map: datasets/seq-id-maps/7scenes_mv-recon_seq-id-map-kf200.json

7scenes-dense:
  cfg:
